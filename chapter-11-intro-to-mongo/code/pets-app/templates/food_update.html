<html>
  <head></head>
  <body>
    This is the update food template.
    <form action="/food/update/{{data['id']}}" method="post">
      <hr />
      <p>Name:<input name="name" value="{{data['name']}}" required /></p>
      <p>Type:<input name="type" value="{{data['type']}}" required /></p>
      <p>
        Price:<input
          name="price"
          type="number"
          min="0"
          step="0.01"
          value="{{data['price']}}"
          required
        />
      </p>
      <hr />
      <button type="submit">Update</button> <a href="/foods">Cancel</a>
      <hr />
    </form>
  </body>
</html>
